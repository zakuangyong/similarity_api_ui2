services:
  similarity-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://mirrors.aliyun.com/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        TORCH_SPEC: ${TORCH_SPEC:-torch==2.8.0}
        TORCHVISION_SPEC: ${TORCHVISION_SPEC:-torchvision==0.23.0}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://mirrors.aliyun.com/pytorch-wheels/cpu}
    volumes:
      - ./models:/app/models:ro
      - ./img:/app/img
      - ./result:/app/result
      - ./configs:/app/configs:ro
    restart: unless-stopped
    expose:
      - "8000"

  similarity-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    depends_on:
      - similarity-backend
    ports:
      - "53378:80"
    restart: unless-stopped
