services:
  similarity-backend:
    build:
      args:
        TORCH_SPEC: ${TORCH_SPEC:-torch==2.8.0+cu128}
        TORCHVISION_SPEC: ${TORCHVISION_SPEC:-torchvision==0.23.0+cu128}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
